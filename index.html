<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="header">
        <div>
          <p class="eyebrow">JUNIOR DEV PROJECT</p>
          <h1>Task Manager</h1>
          <p class="subtitle">Organize your daily tasks.</p>
        </div>
        <div class="counter"><span id="taskCount">0</span> tasks</div>
      </div>

      <form id="taskForm" class="task-form">
        <input id="taskInput" type="text" placeholder="Write a task..." autocomplete="off" maxlength="100">
        <button type="submit">Add Task</button>
      </form>

      <div class="toolbar">
        <div class="filters">
          <button class="filter active" data-filter="all">All</button>
          <button class="filter" data-filter="pending">Pending</button>
          <button class="filter" data-filter="completed">Completed</button>
        </div>
        <button id="clearCompleted" class="clear-btn" type="button">Clear completed</button>
      </div>

      <p id="emptyState" class="empty">No tasks yet. Add your first task.</p>
      <ul id="taskList" class="task-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
